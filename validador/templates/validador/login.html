<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Iniciar sesión | ValidaciónPro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
    <style>
      body { min-height: 100vh; background: #f5f7fb; color: #182230; }
      .login-card { max-width: 440px; border: 1px solid #e5e9f0; border-radius: 1rem; box-shadow: 0 12px 32px rgba(16, 24, 40, .07); }
      .brand-mark { display: inline-grid; width: 2.5rem; height: 2.5rem; place-items: center; border-radius: .7rem; background: #eaf0ff; color: #3157d5; font-weight: 800; }
      .btn-primary { background: #3157d5; border-color: #3157d5; }
    </style>
  </head>
  <body class="d-flex align-items-center py-5">
    <main class="container">
      <div class="login-card bg-white p-4 p-md-5 mx-auto">
        <div class="d-flex align-items-center gap-2 mb-4">
          <span class="brand-mark">V</span>
          <span class="fs-5 fw-semibold">Validación<span class="text-primary">Pro</span></span>
        </div>
        <p class="small text-uppercase fw-bold text-primary mb-2">Acceso local</p>
        <h1 class="h3 fw-bold mb-2">Iniciar sesión</h1>
        <p class="text-secondary mb-4">Entra para validar archivos y consultar sus reportes. En tu primer acceso podrás elegir el estilo visual del entorno.</p>

        <div class="alert alert-warning small" role="note">
          Cuenta mock solo para este prototipo local. No usar en producción.
        </div>
        {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}

        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ request.GET.next }}">
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Usuario</label>
            <input id="username" name="username" class="form-control" autocomplete="username" value="{{ demo_username }}" required autofocus>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Contraseña</label>
            <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100 fw-semibold" type="submit">Entrar</button>
        </form>
      </div>
    </main>
  </body>
</html>
